name: "Atividade 2"
on: 
  workflow_dispatch:
    inputs:
      nome:
        description: "Quem você quer cumprimentar?"
        required: false
        default: "turma"
  push:
    paths:
      - src/**
  schedule:
    - cron: "*/5 * * * *"
jobs:
  atividade_2:
    runs-on: ubuntu-latest
    steps:
      - name: "eu-cheguei"
        env:
          NOME: ${{ inputs.nome || 'agendamento' }}
        run: echo "Olá, $NOME ($GITHUB_EVENT_NAME)"
  
